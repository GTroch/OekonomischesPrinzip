<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das Ökonomische Prinzip — Klug handeln bei Knappheit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#0d1220; --bg-alt:#111830; --surface:#171f38; --surface-alt:#1c2542;
    --ink:#eef1fb; --ink-2:#b9c2e0; --ink-mute:#8790b3;
    --accent:#33d6a6; --accent-strong:#7af0c9; --accent-soft:#123b32;
    --amber:#ffb648; --amber-soft:#3a2a12;
    --danger:#ff6b6b; --danger-soft:#3a1620;
    --border:#2a3358; --border-strong:#3a4470;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    --pro:#4d9bff; --pro-soft:#12233f;
    --contra:#ff9f4d; --contra-soft:#3a260f;
    font-family: "Inter", system-ui, sans-serif;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#f5f3ec; --bg-alt:#eceadf; --surface:#ffffff; --surface-alt:#f1efe6;
    --ink:#191c2b; --ink-2:#4a4f6b; --ink-mute:#7d8199;
    --accent:#0f9d76; --accent-strong:#0c7a5c; --accent-soft:#e0f5ee;
    --amber:#b5750a; --amber-soft:#fbf0da;
    --danger:#c9403f; --danger-soft:#fbe6e5;
    --border:#e0ddd0; --border-strong:#c8c4b3;
    --shadow:0 1px 2px rgba(20,20,10,.06), 0 8px 24px rgba(20,20,10,.06);
    --pro:#1f5fb5; --pro-soft:#e7f0fc;
    --contra:#b5620a; --contra-soft:#fbeede;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --bg:#f5f3ec; --bg-alt:#eceadf; --surface:#ffffff; --surface-alt:#f1efe6;
      --ink:#191c2b; --ink-2:#4a4f6b; --ink-mute:#7d8199;
      --accent:#0f9d76; --accent-strong:#0c7a5c; --accent-soft:#e0f5ee;
      --amber:#b5750a; --amber-soft:#fbf0da;
      --danger:#c9403f; --danger-soft:#fbe6e5;
      --border:#e0ddd0; --border-strong:#c8c4b3;
      --shadow:0 1px 2px rgba(20,20,10,.06), 0 8px 24px rgba(20,20,10,.06);
      --pro:#1f5fb5; --pro-soft:#e7f0fc;
      --contra:#b5620a; --contra-soft:#fbeede;
    }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:"Fraunces", Georgia, serif; font-weight:700; margin:0 0 8px; line-height:1.18; color:var(--ink); }
  p{margin:0 0 10px; line-height:1.6; color:var(--ink-2);}
  .wrap{ max-width:680px; margin:0 auto; padding:0 18px 60px; }
  section{ scroll-margin-top:66px; }

  .topbar{ position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--border); }
  .topbar-in{ max-width:680px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ font-weight:800; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-strong); display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .info-btn{ background:var(--surface-alt); color:var(--ink-2); border:1px solid var(--border); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .navrow{ display:flex; gap:6px; overflow-x:auto; padding:0 18px 10px; max-width:680px; margin:0 auto; scrollbar-width:none; }
  .navrow::-webkit-scrollbar{ display:none; }
  .navlink{ flex-shrink:0; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:999px; background:var(--surface-alt); color:var(--ink-2); text-decoration:none; border:1px solid var(--border); }
  .navlink.active{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }

  .info-panel{ background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin:12px 18px 0; font-size:13px; color:var(--ink-2); max-width:680px; }
  .info-panel h3{ font-size:14px; margin-bottom:8px; color:var(--ink); }
  .info-panel ul{ margin:0; padding-left:18px; }
  .info-panel li{ margin-bottom:6px; }

  .hero{ text-align:center; padding:34px 4px 10px; }
  .hero .kicker{ font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--amber); margin-bottom:10px; }
  .hero h1{ font-size:29px; }
  .hero-art{ width:100%; max-width:220px; height:140px; margin:6px auto 10px; }
  .hero-art svg{ display:block; }
  .hook{ font-size:16px; color:var(--ink); font-style:italic; }

  .btn{ font-family:inherit; font-size:15px; font-weight:700; border-radius:12px; padding:13px 20px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover{ filter:brightness(1.08); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#04201a; }
  .btn.big{ width:100%; text-align:center; padding:15px 20px; font-size:15.5px; }
  .btn.primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.ghost{ background:transparent; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:14px; }
  .section-head{ margin:40px 0 14px; }
  .section-head .num{ font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--amber); margin-bottom:4px; }
  .section-head h2{ font-size:22px; }

  .icon-sm{ width:34px; height:34px; border-radius:10px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-sm svg{ width:19px; height:19px; stroke:var(--accent-strong); fill:none; }

  .praemisse-grid{ display:flex; flex-direction:column; gap:10px; }
  .praemisse{ display:flex; gap:12px; align-items:flex-start; background:var(--surface-alt); border-radius:12px; padding:13px 14px; }
  .praemisse .txt b{ display:block; font-size:14.5px; color:var(--ink); margin-bottom:3px; }
  .praemisse .txt p{ margin:0 0 4px; font-size:13.5px; }
  .praemisse .txt .tag{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-strong); background:var(--accent-soft); padding:2px 8px; border-radius:999px; margin-top:3px; }

  .model-note{ background:var(--amber-soft); border-left:3px solid var(--amber); border-radius:10px; padding:12px 14px; font-size:13.5px; color:var(--ink); margin:14px 0; }

  .check-card{ margin-bottom:10px; }
  .check-q{ font-size:14.5px; color:var(--ink); font-weight:600; margin-bottom:10px; }
  .check-opt{ display:block; width:100%; text-align:left; font-family:inherit; font-size:13.5px; padding:11px 14px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--ink); cursor:pointer; margin-bottom:7px; line-height:1.4; }
  .check-opt.chosen{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
  .check-opt:disabled{ cursor:default; }
  .check-result{ text-align:center; padding:6px 0; }
  .check-result .big-num{ font-family:"Fraunces",serif; font-weight:700; font-size:40px; color:var(--accent-strong); }

  .scenario-box{ background:var(--surface-alt); border-radius:12px; padding:14px 16px; margin:14px 0; border-left:3px solid var(--accent); }
  .scenario-box p{ margin:0; color:var(--ink); font-size:14.5px; }
  .slider-block{ margin:18px 0; }
  .slider-val{ text-align:center; font-family:"Fraunces",serif; font-size:32px; font-weight:700; color:var(--accent-strong); margin-bottom:6px; }
  input[type="range"]{ width:100%; accent-color:var(--accent); height:6px; }
  .slider-labels{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-mute); margin-top:4px; }
  .feedback-box{ border-radius:12px; padding:14px 16px; margin:14px 0; font-size:14px; line-height:1.5; }
  .feedback-box.good{ background:var(--accent-soft); color:var(--ink); border:1px solid var(--accent); }
  .feedback-box.bad{ background:var(--danger-soft); color:var(--ink); border:1px solid var(--danger); }
  .feedback-box.neutral{ background:var(--surface-alt); color:var(--ink); border:1px solid var(--border-strong); }
  .quiz-opt{ display:block; width:100%; text-align:left; font-family:inherit; font-size:14px; padding:13px 15px; border-radius:12px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--ink); cursor:pointer; margin-bottom:9px; line-height:1.4; }
  .quiz-opt.correct{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
  .quiz-opt.wrong{ border-color:var(--danger); background:var(--danger-soft); color:var(--danger); }
  .quiz-opt:disabled{ cursor:default; }

  .glossary-item{ border-bottom:1px solid var(--border); padding:12px 0; }
  .glossary-item:last-child{ border-bottom:none; }
  .glossary-item .term{ font-weight:700; color:var(--ink); font-size:14.5px; margin-bottom:3px; }
  .glossary-item .def{ font-size:13.5px; color:var(--ink-2); }

  /* --- Tension diagram (Knappheit) --- */
  .tension{ display:flex; align-items:center; gap:10px; margin:16px 0; }
  .tension .box{ flex:1; text-align:center; background:var(--surface-alt); border-radius:12px; padding:14px 10px; font-size:13px; font-weight:700; color:var(--ink); border:1px solid var(--border-strong); }
  .tension .box.a{ border-color:var(--pro); color:var(--pro); }
  .tension .box.b{ border-color:var(--contra); color:var(--contra); }
  .tension .arrow{ font-size:20px; color:var(--ink-mute); flex-shrink:0; }
  .tension-note{ text-align:center; font-size:13px; font-weight:700; color:var(--amber); margin:4px 0 14px; }

  /* --- Price table (Einstieg) --- */
  .price-table{ width:100%; border-collapse:collapse; font-size:13px; margin:12px 0; }
  .price-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-mute); padding:6px 8px; border-bottom:1px solid var(--border-strong); }
  .price-table td{ padding:9px 8px; border-bottom:1px solid var(--border); color:var(--ink); }
  .price-table tr.best td{ background:var(--accent-soft); font-weight:700; color:var(--accent-strong); }
  .price-table .perkg{ font-variant-numeric:tabular-nums; }
  .reveal-btn{ font-family:inherit; font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); cursor:pointer; }

  /* --- Classification cards (Praxis) --- */
  .score-pill{ display:inline-block; font-size:12.5px; font-weight:800; color:var(--accent-strong); background:var(--accent-soft); border-radius:999px; padding:4px 12px; margin-bottom:14px; }
  .sach-card{ margin-bottom:10px; }
  .sach-txt{ font-size:14px; color:var(--ink); margin-bottom:10px; }
  .sach-btns{ display:flex; gap:8px; }
  .sach-btn{ flex:1; font-family:inherit; font-size:13px; font-weight:700; padding:10px 8px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--ink); cursor:pointer; }
  .sach-btn.correct{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .sach-btn.wrong{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .sach-btn:disabled{ cursor:default; opacity:.9; }
  .sach-expl{ font-size:12.5px; color:var(--ink-2); margin-top:9px; padding-top:9px; border-top:1px solid var(--border); }

  /* --- Needs sort (Knappheit) --- */
  .need-card{ margin-bottom:9px; }
  .need-txt{ font-size:14px; color:var(--ink); margin-bottom:9px; font-weight:600; }
  .need-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .need-btn{ flex:1; min-width:86px; font-family:inherit; font-size:12px; font-weight:700; padding:8px 6px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--ink); cursor:pointer; }
  .need-btn.correct{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .need-btn.wrong{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .need-btn:disabled{ cursor:default; }

  /* --- Ice cream variants --- */
  .ice-card{ display:block; width:100%; text-align:left; font-family:inherit; background:var(--surface-alt); border:1px solid var(--border-strong); border-radius:12px; padding:12px 14px; margin-bottom:9px; cursor:pointer; color:var(--ink); font-size:13.5px; }
  .ice-card b{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-mute); margin-bottom:3px; font-weight:800; }
  .ice-card.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .ice-card.correct{ border-color:var(--accent); background:var(--accent-soft); }
  .ice-card.correct b{ color:var(--accent-strong); }

  /* --- Dual utility sliders (Opportunitätskosten) --- */
  .util-cols{ display:flex; gap:12px; }
  .util-col{ flex:1; }
  .util-col h4{ font-size:13.5px; margin:0 0 10px; color:var(--ink); text-align:center; }
  .util-row{ margin-bottom:14px; }
  .util-row .lbl{ font-size:12px; color:var(--ink-2); margin-bottom:4px; display:block; }
  .util-row input[type=range]{ height:5px; }
  .util-row .val{ text-align:center; font-size:12.5px; font-weight:700; color:var(--accent-strong); }
  .util-sum{ text-align:center; margin-top:10px; padding-top:12px; border-top:1px solid var(--border); }
  .util-sum .n{ font-family:"Fraunces",serif; font-size:26px; font-weight:700; color:var(--ink); }
  textarea.noteArea{ width:100%; min-height:100px; font-family:inherit; font-size:13.5px; padding:12px 14px; border-radius:12px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--ink); resize:vertical; }
  .save-hint{ font-size:12px; color:var(--ink-mute); margin-top:6px; min-height:14px; }

  /* --- Lückentext --- */
  .luecke-text{ font-size:14.5px; line-height:2.1; color:var(--ink); }
  .luecke-text select{ font-family:inherit; font-size:13px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:3px 6px; margin:0 2px; }
  .luecke-text select.wrong{ color:var(--danger); background:var(--danger-soft); border-color:var(--danger); }
  .luecke-text select.correct{ color:var(--accent-strong); }

  .final-score{ text-align:center; padding:10px 0; }
  .final-score .n{ font-family:"Fraunces",serif; font-weight:700; font-size:44px; color:var(--accent-strong); }

  [hidden]{ display:none !important; }

  @media (max-width:420px){
    .wrap{ padding:0 12px 50px; }
    .hero h1{ font-size:23px; }
    .card{ padding:15px; }
    .util-cols{ flex-direction:column; }
  }
</style>
</head>
<body>

  <div class="topbar-in">
    <div class="brand">⚖️ Ökonomisches Prinzip</div>

</div>

<div class="wrap" id="stage"></div>

  function renderEinstieg(){
    var body = document.getElementById("priceBody");

    var best = null;
    PRICES.forEach(function(p,i){
      var perKg = p.preis / p.kg;
      if(best===null || perKg < PRICES[best].preis/PRICES[best].kg) best = i;
    });
    body.innerHTML = PRICES.map(function(p,i){
      var perKg = p.preis / p.kg;
      var show = S.priceRevealed;
      return '<tr class="'+(show && i===best ? "best" : "")+'">'
        + '<td>'+esc(p.name)+'<br><span style="color:var(--ink-mute);font-size:11.5px;">'+esc(p.desc)+'</span></td>'
        + '<td>'+p.kg.toLocaleString("de-DE")+' kg</td>'
        + '<td>'+p.preis.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+' €</td>'
        + '<td class="perkg">'+(show ? perKg.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+' €' : "—")+'</td>'
      + '</tr>';
    }).join("");

    var actionHolder = document.getElementById("priceActionHolder");
    if(!S.priceRevealed){
      actionHolder.innerHTML = '<button class="reveal-btn" id="revealPriceBtn">Preise pro Kilogramm berechnen</button>';

      + '<p style="margin-top:14px;">Genau solche Abwägungen treffen wir ständig — bewusst oder unbewusst. Ökonominnen und Ökonomen nennen das Prinzip dahinter das <b>ökonomische Prinzip</b>. Bevor wir es genauer betrachten, schauen wir uns an, warum wir überhaupt ständig solche Entscheidungen treffen müssen.</p>';

      var btnMin = "sach-btn" + (chosen!==undefined ? (s.ans===0?" correct":(chosen===0?" wrong":"")) : "");

        + '<h3 style="font-size:16px;">Zum Nachdenken</h3>'
        + '<p style="font-size:13.5px;">Übermorgen schreibst du deine letzte Mathearbeit des Schuljahres. Dein Notendurchschnitt liegt bei 2,5 — egal wie du abschneidest, im Zeugnis wird es nicht besser als eine 2 und nicht schlechter als eine 3. Beschreibe: Wie würdest du nach dem <b>Minimalprinzip</b> und wie nach dem <b>Maximalprinzip</b> an deine Lernzeit herangehen?</p>'
        + '<textarea class="noteArea" id="noteArea" placeholder="Deine Gedanken (nur auf diesem Gerät gespeichert) …"></textarea>'
        + '<div class="save-hint" id="saveHint">&nbsp;</div>'
      + '</div>'
    + '</section>';
  }

  function renderUtil(){
    var holder = document.getElementById("utilHolder");
    if(!holder) return;
    function col(side, data){
      var rows = data.items.map(function(txt, i){
        var v = S.util[side][i];
        return '<div class="util-row"><span class="lbl">'+esc(txt)+'</span>'
          + '<input type="range" min="-3" max="3" step="1" value="'+v+'" data-side="'+side+'" data-i="'+i+'">'
          + '<div class="val">'+(v>0?"+":"")+v+'</div></div>';
      }).join("");
      return '<div class="util-col"><h4>'+esc(data.title)+'</h4>'+rows+'</div>';
    }
    holder.innerHTML = col("L", UTIL_LEFT) + col("R", UTIL_RIGHT);
    holder.querySelectorAll("input[type=range]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var side = inp.getAttribute("data-side"), i = +inp.getAttribute("data-i");
        S.util[side][i] = +inp.value;
        renderUtil();
      });
    });
    var sumL = S.util.L.reduce(function(a,b){return a+b;},0);
    var sumR = S.util.R.reduce(function(a,b){return a+b;},0);
    var msg;
    if(sumL>sumR) msg = "Bei dir überwiegt gerade <b>Lernen</b>.";
    else if(sumR>sumL) msg = "Bei dir überwiegt gerade <b>Schwimmbad</b>.";
    else msg = "Bei dir halten sich beide Optionen genau die Waage — eine knifflige Entscheidung!";
    document.getElementById("utilSumHolder").innerHTML = '<span class="n">'+sumL+'</span> &nbsp;vs.&nbsp; <span class="n">'+sumR+'</span><p style="margin-top:8px;">'+msg+' Es gibt hier kein objektiv richtig oder falsch — jede Entscheidung hat ihre eigenen Opportunitätskosten.</p>';
  }

  function bindNote(){
    var na = document.getElementById("noteArea");
    if(!na) return;
    na.value = S.note;
    na.addEventListener("input", function(){
      S.note = na.value;
      try{ localStorage.setItem("oep_note", S.note); }catch(e){}
      var hint = document.getElementById("saveHint");
      if(hint) hint.textContent = "Gespeichert ✓";
    });
  }

  // ============ SECTION 6: TEST ============
  function testHtml(){
    return '<section id="test">'
      + '<div class="section-head"><div class="num">Abschnitt 6</div><h2>Abschlusstest</h2></div>'
      + '<div class="card">'
        + '<h3 style="font-size:16px;">Lückentext</h3>'
        + '<p style="font-size:13.5px;">Wähle für jede Lücke den passenden Begriff aus.</p>'
        + '<div class="luecke-text" id="lueckeHolder"></div>'
        + '<div id="lueckeActionHolder"></div>'
      + '</div>'
      + '<div class="card">'
        + '<h3 style="font-size:16px;">Quiz</h3>'
        + '<div id="quizHolder"></div>'
      + '</div>'
    + '</section>';
  }

  function renderLuecke(){
    var holder = document.getElementById("lueckeHolder");
    if(!holder) return;
    var blankIdx = 0;
    var html = LUECKE_PARTS.map(function(part){
      if(typeof part === "number"){
        var bi = part;
        var val = S.lueckeVal[bi];
        var cls = "";
        if(S.luecheChecked){ cls = (val === LUECKE_ANS[bi]) ? "correct" : "wrong"; }
        var opts = '<option value="">…wählen…</option>' + LUECKE_WORDS.map(function(w){
          return '<option value="'+esc(w)+'" '+(val===w?"selected":"")+'>'+esc(w)+'</option>';
        }).join("");
        return '<select class="'+cls+'" data-bi="'+bi+'" '+(S.luecheChecked?"disabled":"")+'>'+opts+'</select>';
      }
      return esc(part);
    }).join("");
    holder.innerHTML = html;
    holder.querySelectorAll("select").forEach(function(sel){
      sel.addEventListener("change", function(){
        S.lueckeVal[+sel.getAttribute("data-bi")] = sel.value || null;
        renderLuecke();
      });
    });

    var ah = document.getElementById("lueckeActionHolder");
    var allFilled = S.lueckeVal.every(function(v){ return v; });
    if(!S.luecheChecked){
      ah.innerHTML = '<button class="btn primary" id="lueckeCheckBtn" '+(allFilled?"":"disabled")+' style="margin-top:12px;">Prüfen</button>';
      var cb = document.getElementById("lueckeCheckBtn");
      if(cb) cb.addEventListener("click", function(){ S.luecheChecked = true; renderLuecke(); });
    } else {
      var correct = S.lueckeVal.filter(function(v,i){ return v===LUECKE_ANS[i]; }).length;
      ah.innerHTML = '<div class="feedback-box '+(correct===LUECKE_ANS.length?"good":"neutral")+'" style="margin-top:12px;">'+correct+' von '+LUECKE_ANS.length+' Lücken richtig ausgefüllt.</div>';
    }
  }

  function renderQuiz(){
    var holder = document.getElementById("quizHolder");
    if(!holder) return;
    var total = QUIZ.length;
    var answeredCount = Object.keys(S.quizAns).length;

    if(answeredCount === total){
      var correct = QUIZ.filter(function(q,i){ return S.quizAns[i]===q.ans; }).length;
      var msg;
      if(correct===total) msg = "Bestens vorbereitet! Du beherrschst das ökonomische Prinzip sicher.";
      else if(correct>=Math.ceil(total*0.6)) msg = "Gut gemacht — schau dir die Erklärungen der offenen Fragen noch einmal an.";
      else msg = "Wiederhole am besten noch einmal die Abschnitte „Das Prinzip“ und „In der Praxis“.";
      holder.innerHTML = '<div class="final-score"><div class="n">'+correct+' / '+total+'</div><p>'+msg+'</p></div>'
        + QUIZ.map(function(q,i){
            var chosen = S.quizAns[i];
            var optsHtml = q.opts.map(function(opt,j){
              var cls = j===q.ans ? "correct" : (j===chosen && j!==q.ans ? "wrong" : "");
              return '<div class="quiz-opt '+cls+'" style="cursor:default;'+(cls?"":"opacity:.5;")+'">'+esc(opt)+'</div>';
            }).join("");
            return '<div style="margin-top:18px;"><p style="font-weight:700;color:var(--ink);">'+(i+1)+'. '+esc(q.q)+'</p>'+optsHtml+'<div class="feedback-box good">'+esc(q.expl)+'</div></div>';
          }).join("");
      return;
    }

    var i = S.quizIdx;
    var q = QUIZ[i];
    holder.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">Frage '+(i+1)+' von '+total+'</p>'
      + '<p style="font-weight:700;color:var(--ink);">'+esc(q.q)+'</p>'
      + q.opts.map(function(opt,j){ return '<button class="quiz-opt" data-j="'+j+'">'+esc(opt)+'</button>'; }).join("");
    holder.querySelectorAll(".quiz-opt").forEach(function(btn){
      btn.addEventListener("click", function(){
        S.quizAns[i] = +btn.getAttribute("data-j");
        S.quizIdx = Math.min(i+1, total-1);
        renderQuiz();
      });
    });
  }

  // ============ GLOSSARY ============
  function glossaryHtml(){
    var items = GLOSSAR.map(function(g){
      return '<div class="glossary-item"><div class="term">'+esc(g.t)+'</div><div class="def">'+esc(g.d)+'</div></div>';
    }).join("");
    return '<section id="glossar">'
      + '<div class="section-head"><div class="num">Nachschlagen</div><h2>Glossar</h2></div>'
      + '<div class="card">'+items+'</div>'
      + '<p style="text-align:center; font-size:11.5px; color:var(--ink-mute); margin-top:10px;">Erarbeitet auf Grundlage eigenen Unterrichtsmaterials zum ökonomischen Prinzip.</p>'
    + '</section>';
  }

  // ============ RENDER ALL ============
  function renderAll(){
    stage.innerHTML = heroHtml() + einstiegHtml() + knappheitHtml() + prinzipHtml() + praxisHtml() + kostenHtml() + testHtml() + glossaryHtml();
    renderEinstieg();
    renderNeeds();
    renderSach();
    renderIce();
    renderUtil();
    bindNote();
    renderLuecke();
    renderQuiz();
  }

  document.addEventListener("DOMContentLoaded", function(){
    renderNav();
    document.getElementById("infoPanelHolder").innerHTML = infoPanelHtml();
    bindInfoBtn();
    renderAll();
    bindScrollspy();
  });
})();
</script>
</body>
</html>
